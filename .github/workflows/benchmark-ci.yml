name: VAD Benchmark CI

on:
  push:
    branches: [main, benchmark-foundation-v0.1.0]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --upgrade pip jsonschema

      - name: Validate canonical config and sample run
        run: python scripts/validate_study.py --config configs/study-v0.1.0.json --run examples/sample-run.json

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke-test scoring
        run: python scripts/score.py examples/sample-run.json --out /tmp/scored.json

      - name: Smoke-test aggregation
        run: |
          mkdir -p /tmp/vad-raw /tmp/vad-processed
          cp examples/sample-run.json /tmp/vad-raw/run01.json
          python scripts/aggregate.py /tmp/vad-raw --out /tmp/vad-processed/summary.json
          cat /tmp/vad-processed/summary.json
